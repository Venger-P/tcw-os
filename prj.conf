# --- Core System ---
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- C++ & TFLite Micro (as before) ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CBPRINTF_COMPLETE=y

# --- Threads & Memory ---
# Increase stack for TFLite Micro on Xtensa
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_THREAD_NAME=y
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_LOG=n

# --- ESP32-S3 Specific ---
# The board likely has 8MB flash but no PSRAM. If your specific model has
# PSRAM, you can add CONFIG_ESP_SPIRAM=y here. Otherwise, leave it out.
# CONFIG_ESP_SPIRAM=y
